<!DOCTYPE html>
<!-- Same result as AllProposals.html without using Knockout -->
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <link rel="stylesheet" href="//maxcdn.bootstrapcdn.com/bootstrap/3.3.4/css/bootstrap.min.css">
    <style>
        body {
            padding-top: 50px;
        }
    </style>
    <title>ProPricer API Test</title>
</head>
<body>
    <div class="navbar navbar-inverse navbar-fixed-top" role="navigation">
        <div class="container">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="/">eCAPS ProPricer API Test</a>
            </div>
            <div class="collapse navbar-collapse">
                <ul class="nav navbar-nav">
                    <li class="active"><a href="AllProposals.html">List</a></li>
                    <li><a href="ProposalAdd.html">Add</a></li>
                    <li><a href="Spread.html">Spread</a></li>
                    <li><a href="/help">API</a></li>
                </ul>
            </div><!--/.nav-collapse -->
        </div>
    </div><!--/.navbar -->

    <div class="container">

        <div>
            <h2>All Proposals</h2>
        </div>
        <div>
            <table id="proposalList" class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Proposal Name</th>
                        <th>Description</th>
                        <th>Folder</th>
                        <th>Creator</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- empty to start -->
                </tbody>
            </table>
        </div>

    </div><!-- /.container -->

    <script src="//ajax.aspnetcdn.com/ajax/jQuery/jquery-2.0.3.min.js"></script>
    <script src="//maxcdn.bootstrapcdn.com/bootstrap/3.3.4/js/bootstrap.min.js"></script>

    <script>
        // Load proposal list JSON from server, convert it to Proposal instances, then populate self.proposals
        $.getJSON("/api/proposals", function (proposals) {
            // native JavaScript sort with custom compare function - http://stackoverflow.com/questions/979256/sorting-an-array-of-javascript-objects
            proposals.sort(propCompare);

            var $listTbody = $('#proposalList tbody');
            $.each(proposals, function (index, prop) {
                $listTbody.append("            <tr>"
                    + "<td><a href='Proposal.html?id=" + prop.id + "'>" + prop.name + ' v.' + prop.version + "</a></td>"
                    + "<td>" + prop.description + "</td>"
                    + "<td>" + prop.parentFolderName + "</td>"
                    + "<td>" + prop.creator_Name + "</td>"
                    + "</tr>");
            });
        });

        function propCompare(left, right) {
            if (left.ParentFolderName == right.ParentFolderName) {
                return left.Name == right.Name ? 0 : (left.Name < right.Name ? -1 : 1)
            } else if (left.ParentFolderName < right.ParentFolderName) {
                return -1
            } else {
                return 1
            }
        }
    </script>
</body>
</html>
